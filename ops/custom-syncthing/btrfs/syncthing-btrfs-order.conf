# Installed as /etc/systemd/system/syncthing@jhf.service.d/btrfs-helper-order.conf
# by install.sh. Stop order is the reverse of start order: ordering
# syncthing after the helper socket makes systemd stop syncthing (and run
# its shutdown btrfs pairing) while the socket still accepts, at service
# restarts and at reboot alike. /home is a separate btrfs mount on yarlung;
# syncthing's folder and the helper's snapshots live there.
[Unit]
Wants=syncthing-btrfs.socket
After=syncthing-btrfs.socket
RequiresMountsFor=/home
# The stop must outlast syncthing's own bounded shutdown (svcutil.StopTimeout:
# 120 s folder shutdown budget + 15 s supervisor cleanup/margin + 10 s
# database close + 4 s exit flushes + 11 s margin = 160 s); systemd's default
# 90 s SIGKILLed syncthing mid-pairing. Pinned by
# TestSystemdStopTimeoutCoversShutdown in lib/svcutil.
[Service]
TimeoutStopSec=160
